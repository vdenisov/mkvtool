name: Native and release

# The v2 Kotlin app (mkvtool). Kept separate from ci.yml, which stays Groovy-only and
# untouched during the port. Four jobs with different cadences:
#   build       - fast Linux JVM build + unit tests, on every push-to-main and PR. Also
#                 reads the project version, which the release job consumes.
#   harness-app - the Groovy oracle against the JVM launcher, plus a smaller pass over the
#                 fat jar, on every push-to-main and PR.
#   native      - the slow 4-OS GraalVM native-image build, its smoke probes, the acceptance
#                 runs against the resulting binary, and the packaging of that binary into
#                 its release archive; only on merge (push to main), a pushed v* tag, the
#                 weekly schedule, and manual dispatch. Native config rarely changes and
#                 each compile is minutes per OS, so it does not run per PR commit. Runner
#                 minutes are free (public repo), so this is about CI noise, not cost.
#                 Verify a branch by dispatching this workflow against it.
#   release     - collects those archives, the jar and a checksums file. On a pushed v* tag
#                 it creates a DRAFT release from them; on a dispatch it leaves them as a
#                 workflow artifact and touches no release at all, which is how the whole
#                 path is rehearsed without spending a tag.
#
# Nothing here ever publishes. A draft's assets need a token to download, so the Windows
# binary is signed and re-uploaded by a human before anyone can reach it - which is also
# why the Windows leg uploads the bare exe on its own.
on:
  push:
    branches: [main]
    # A v* tag is a release attempt. A tag push carries no branch, so the filter above does
    # not apply to it.
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    # Weekly canary: catches a GraalVM/base-image change that breaks the native build
    # without any commit here.
    - cron: "0 7 * * 1"
  workflow_dispatch:

# Read by default. Only the release job widens this, and only to attach assets to a draft.
permissions:
  contents: read

jobs:
  build:
    # Everything except the weekly canary, which only needs the native leg.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    name: Build + unit tests (JDK 21)
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Ordinary JVM build: compile, unit tests, and the shadow jar. No GraalVM and no
      # MKVToolNix — the unit tier fakes probe data and the native-smoke probe uses
      # neither mkvmerge nor a native image here.
      - name: Build and test
        run: ./gradlew build

      # Read from the build rather than parsed out of gradle.properties, so there is one
      # implementation of "what version is this" — the one that also names every archive.
      # Published as a job output, which is what lets the release job run with no JDK at all.
      - name: Read the project version
        id: version
        run: |
          version="$(./gradlew -q printVersion | tail -n1 | tr -d '\r')"
          # An unparsable value would otherwise flow into asset names and compare as a string
          # against the tag below, matching nothing and explaining nothing.
          case "$version" in
            "" | *[!0-9A-Za-z.-]*)
              echo "*** could not read the project version: [$version]"
              exit 1
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "project version: $version"

      # A tag push is a release attempt, and this refuses a mismatched one a minute in rather
      # than after four native legs have spent twenty minutes building assets nobody can use.
      # The release job asks again, because that is where the tag actually names a release.
      - name: Check the tag against the project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${{ steps.version.outputs.version }}"
          case "$version" in
            *-SNAPSHOT)
              echo "*** refusing to release $version: stamp the real version in gradle.properties first"
              exit 1
              ;;
          esac
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "*** tag $GITHUB_REF_NAME does not match the project version $version"
            exit 1
          fi

  harness-app:
    # The Groovy acceptance harness (the port's oracle) run against the mkvtool binary
    # instead of the scripts. It was non-blocking while the port was under way and every
    # command was still missing; with `mux` landed it passes in full, so it is now a
    # blocking check — a case that goes red here is a behavior difference from the scripts,
    # which is exactly what must not merge. Add it to branch-protection required checks.
    #
    # It carries the fat jar's only coverage too, at the end: MKVToolNix, Groovy and the
    # Grapes cache are already paid for here, and a job of its own would spend three minutes
    # of setup to run bytecode this one already ran.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    name: Acceptance harness (JVM launcher and fat jar)
    env:
      GROOVY_VERSION: "5.0.6"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # The launcher the harness invokes (build/install/mkvtool/bin/mkvtool), and the one
      # that runs the fat jar (build/jar-launcher/mkvtool), which also builds the jar.
      - name: Build the JVM launcher and the fat-jar launcher
        run: ./gradlew installDist jarLauncher

      # The harness needs mkvmerge at startup and asserts output via mkvmerge -J.
      - name: Install MKVToolNix
        run: |
          sudo apt-get update
          sudo apt-get install -y mkvtoolnix
          mkvmerge --version

      - name: Cache Groovy distribution
        uses: actions/cache@v6
        with:
          path: ~/groovy
          key: groovy-${{ env.GROOVY_VERSION }}

      - name: Install Groovy
        run: |
          if [ ! -d "$HOME/groovy/groovy-${{ env.GROOVY_VERSION }}" ]; then
            curl -fsSL -o /tmp/groovy.zip "https://archive.apache.org/dist/groovy/${{ env.GROOVY_VERSION }}/distribution/apache-groovy-binary-${{ env.GROOVY_VERSION }}.zip"
            mkdir -p "$HOME/groovy"
            unzip -q /tmp/groovy.zip -d "$HOME/groovy"
          fi
          echo "$HOME/groovy/groovy-${{ env.GROOVY_VERSION }}/bin" >> "$GITHUB_PATH"

      - name: Cache Grapes
        uses: actions/cache@v6
        with:
          path: ~/.groovy/grapes
          key: grapes-${{ env.GROOVY_VERSION }}-${{ hashFiles('src/**/*.groovy') }}
          restore-keys: |
            grapes-${{ env.GROOVY_VERSION }}-

      - name: Run acceptance harness against the app
        run: groovy src/test/run_tests.groovy --target app

      # The fat jar is published as the JVM fallback and no tier ran it: the step above covers
      # the same bytecode through the installDist launcher, and the native legs cover it
      # compiled. What only the jar can break is its own packaging — the Main-Class manifest
      # and the resources merged from several dependencies — so native-smoke does most of the
      # work here (it decodes a charset, reads a CLDR name, parses JSON and round-trips YAML
      # inside the process), and three cases put real files, a real mkvmerge call and
      # non-ASCII names through the CLI. Run after the full suite, never beside it: the
      # harness keys its work directories by case name and recreates them at case start, so
      # two concurrent suites wipe each other's fixtures.
      - name: Smoke-test the fat jar
        run: |
          launcher=build/jar-launcher/mkvtool
          "$launcher" --version
          "$launcher" native-smoke
          cases=(
            # a real mkvmerge invocation end to end
            01_one_audio_one_subtitle
            # a windows-1251 decode through the CLI, i.e. the charset resources survived shading
            50_to_utf8_converts_in_place
            # Cyrillic through fetch, rename and file names
            38_non_ascii_titles_round_trip
          )
          failed=""
          for case_name in "${cases[@]}"; do
            echo "::group::$case_name"
            if ! groovy src/test/run_tests.groovy --target app --app-bin "$launcher" --filter "$case_name"; then
              failed="$failed $case_name"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "*** Fat-jar cases failed:$failed"
            exit 1
          fi

      # The jar attached to a release is the one this job just tested, for the same reason
      # each native archive is packaged in the leg that tested its binary.
      - name: Package the release jar
        run: ./gradlew releaseJar

      # As on the native legs: packaged every run so the task cannot rot unnoticed, uploaded only
      # when the release job will collect it.
      - name: Upload the release jar
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: release-jar
          path: build/release/
          if-no-files-found: error

  native:
    # Merge (push is main-only via the branch filter) + weekly schedule + manual. This is
    # the only leg that exercises the *native* binary — harness-app above covers the JVM
    # launcher — so the acceptance runs live here rather than in a job of their own, next to
    # the binary they need. The weekly canary therefore also re-checks acceptance, which is
    # what would catch a GraalVM update changing behavior rather than just breaking the build.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            binary: build/native/nativeCompile/mkvtool
            # mkvtoolnix is one apt package here, so this leg runs the whole oracle.
            acceptance: full
          - os: windows-latest
            label: windows-x64
            binary: build/native/nativeCompile/mkvtool.exe
            acceptance: smoke
          - os: macos-latest
            label: macos-arm64
            binary: build/native/nativeCompile/mkvtool
            acceptance: smoke
          # GraalVM does not cross-compile, so an Intel binary needs an Intel host. The
          # -intel labels are the standard runner tier, free for public repositories; the
          # -large and -xlarge variants are the billed one. This image line is the last
          # x86_64 one GitHub has announced, scheduled to end around August 2027 — after
          # that this asset needs another host or gets dropped.
          - os: macos-15-intel
            label: macos-x64
            binary: build/native/nativeCompile/mkvtool
            acceptance: smoke
    runs-on: ${{ matrix.os }}
    name: Native ${{ matrix.label }}
    # A leg finishes well inside this. The ceiling is here because native-image can *hang*
    # rather than fail on macOS x64, and the six-hour default would sit on a runner for the
    # rest of the day before saying so.
    timeout-minutes: 45
    env:
      GROOVY_VERSION: "5.0.6"
    defaults:
      run:
        # Git Bash is present on the Windows runner too, so one script runs everywhere.
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # GraalVM CE (license-clean for an OSS project); installs native-image. The token
      # avoids anonymous GitHub download rate limits.
      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: "21"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: gradle/actions/setup-gradle@v4

      # An Intel runner and an Intel toolchain are two separate claims: setup-graalvm picks
      # its download from the host architecture, and an arm64 JDK on an Intel host would
      # produce a binary that runs under Rosetta and reports the wrong architecture. Checked
      # on both macOS legs, so the mirror mistake is caught too, and checked *before* the
      # compile so a wrong JDK costs a minute instead of twenty.
      - name: Check the toolchain architecture
        if: runner.os == 'macOS'
        run: |
          case "${{ matrix.label }}" in
            *-x64)   want_uname=x86_64 ; want_arch=x86_64  ;;
            *-arm64) want_uname=arm64  ; want_arch=aarch64 ;;
          esac
          uname -m
          java -XshowSettings:properties -version 2>&1 | grep -E 'os\.arch|java\.vendor'
          test "$(uname -m)" = "$want_uname"
          java -XshowSettings:properties -version 2>&1 | grep -qE "os\.arch = $want_arch\$"

      - name: Build native image
        run: ./gradlew nativeCompile

      # The same question asked of the artifact rather than of the toolchain. An arm64 build
      # published under an x64 name is the one outcome worse than not publishing the asset,
      # and nothing downstream can tell the difference by looking at the file name.
      - name: Check the binary architecture
        if: runner.os == 'macOS'
        run: |
          case "${{ matrix.label }}" in
            *-x64)   want=x86_64 ;;
            *-arm64) want=arm64  ;;
          esac
          file -b "${{ matrix.binary }}"
          file -b "${{ matrix.binary }}" | grep -q "$want"

      # The probe self-asserts and exits non-zero on any mismatch, so running it IS the
      # assertion: proves -H:+AddAllCharsets (windows-1251 decode) and -H:+IncludeAllLocales
      # (CLDR native name) survived into this OS's native binary.
      - name: Smoke-test native binary
        run: |
          "${{ matrix.binary }}" native-smoke

      # The acceptance tier below runs the Groovy oracle against the binary just built. The
      # probes above cover what fails silently *inside* the image; these cover what the image
      # does to real files, real mkvmerge invocations and real console output.

      # The harness needs mkvmerge at startup and asserts output via mkvmerge -J; mkvpropedit
      # is what keeps the propedit and filename-to-title cases from self-skipping.
      - name: Install MKVToolNix
        run: |
          case "$RUNNER_OS" in
            Linux)
              sudo apt-get update
              sudo apt-get install -y mkvtoolnix
              ;;
            macOS)
              HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install mkvtoolnix
              ;;
            Windows)
              choco install mkvtoolnix --yes --no-progress
              # A choco install does not reach this job's already-started PATH, so add the
              # installer's fixed location by hand: in Windows form for the later steps, whose
              # PATH lookups happen inside the JVM and the native binary, and in POSIX form for
              # the two proof lines below, which bash resolves. (Even without either, both
              # findMkvTool implementations fall back to this very directory on Windows.)
              echo "C:\Program Files\MKVToolNix" >> "$GITHUB_PATH"
              export PATH="/c/Program Files/MKVToolNix:$PATH"
              ;;
          esac
          mkvmerge --version
          mkvpropedit --version

      - name: Cache Groovy distribution
        uses: actions/cache@v6
        with:
          path: ~/groovy
          # Keyed on the leg's label, not on runner.os: the two macOS legs would otherwise
          # share one key and race each other for it.
          key: groovy-${{ env.GROOVY_VERSION }}-${{ matrix.label }}

      - name: Install Groovy
        run: |
          if [ ! -d "$HOME/groovy/groovy-$GROOVY_VERSION" ]; then
            curl -fsSL -o /tmp/groovy.zip "https://archive.apache.org/dist/groovy/$GROOVY_VERSION/distribution/apache-groovy-binary-$GROOVY_VERSION.zip"
            mkdir -p "$HOME/groovy"
            # `jar` rather than `unzip`: Git Bash on the Windows runner ships no unzip, while
            # setup-graalvm guarantees a JDK (and its bin on PATH) on every leg.
            (cd "$HOME/groovy" && jar xf /tmp/groovy.zip)
          fi
          # `jar` extracts without the zip entries' Unix modes, so the launchers come out
          # non-executable and Linux/macOS fail with exit 126 (`unzip` would have kept them).
          # Outside the guard above on purpose: the cache can hold a tree unpacked this way.
          chmod +x "$HOME/groovy/groovy-$GROOVY_VERSION/bin"/*
          # Named rather than put on PATH: the launcher is invoked from bash on all three
          # runners, and a bash-style path in GITHUB_PATH would mean nothing to another shell.
          echo "GROOVY=$HOME/groovy/groovy-$GROOVY_VERSION/bin/groovy" >> "$GITHUB_ENV"

      - name: Cache Grapes
        uses: actions/cache@v6
        with:
          path: ~/.groovy/grapes
          key: grapes-${{ env.GROOVY_VERSION }}-${{ matrix.label }}-${{ hashFiles('src/**/*.groovy') }}
          restore-keys: |
            grapes-${{ env.GROOVY_VERSION }}-${{ matrix.label }}-

      # The whole oracle against the native binary. `--app-bin` is the seam task 0.4 left for
      # exactly this: a binary whose name does not end in .bat is launched directly, so the
      # (frozen) harness needs no change to test a native build.
      - name: Run the full acceptance harness against the native binary
        if: matrix.acceptance == 'full'
        run: |
          "$GROOVY" src/test/run_tests.groovy --target app --app-bin "${{ matrix.binary }}"

      # One representative case per command instead of the full suite: this leg exists to catch
      # what differs *per OS* in the native image, and 132 cases here would triple the leg for
      # coverage the Linux leg already has. `--filter` takes a single substring, so each case is
      # its own harness run; all of them run before the step fails, because which command broke
      # on which OS is the whole answer.
      - name: Run the acceptance smoke subset against the native binary
        if: matrix.acceptance == 'smoke'
        run: |
          cases=(
            # to-utf8: a windows-1251 decode through the CLI, i.e. -H:+AddAllCharsets with teeth
            50_to_utf8_converts_in_place
            # fix-srt: the reformat state machine over a charset-detected read
            87_fix_srt_fixes_valid_file
            # propedit: real mkvpropedit argv passthrough (31 is a no-op, so it proves less)
            32_propedit_passthrough
            # filename-to-title: the second mkvpropedit command
            85_filename_to_title_sets_title
            # fetch-episodes: loopback HTTP, both metadata files written
            35_fetch_episodes_stub
            # rename: the episodes.yaml load, i.e. snakeyaml in the image
            94_rename_prefers_yaml
            # inspect: both modes off one mkvmerge -J scan
            74_check_and_identify_combined
            # mux: a real mkvmerge invocation end to end
            01_one_audio_one_subtitle
            # Cyrillic through fetch, rename and file names — where a native image's stdout and
            # filesystem encodings would differ from the JVM's if they differ anywhere.
            38_non_ascii_titles_round_trip
          )
          failed=""
          for case_name in "${cases[@]}"; do
            echo "::group::$case_name"
            if ! "$GROOVY" src/test/run_tests.groovy --target app --app-bin "${{ matrix.binary }}" --filter "$case_name"; then
              failed="$failed $case_name"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "*** Smoke cases failed:$failed"
            exit 1
          fi

      # find-unused-fonts is the one command the Groovy oracle has no case for, on any tier, so
      # the subset above cannot supply a representative for it. Asserted here instead: one font
      # the subtitle references, one it does not, and the unreferenced base name — no extension,
      # no prefix, no summary — is the whole of the output.
      - name: Check find-unused-fonts against the native binary
        run: |
          bin="$PWD/${{ matrix.binary }}"
          work="$(mktemp -d)"
          mkdir -p "$work/fonts"
          printf 'Style: Default,Cuprum,20\n' > "$work/subs.ass"
          : > "$work/fonts/Cuprum.ttf"
          : > "$work/fonts/Unused Font.otf"
          # `tr -d` because the tool ends its lines with the platform separator: on Windows the
          # captured value would otherwise carry a trailing CR and never equal the expected name.
          out="$(cd "$work" && "$bin" find-unused-fonts | tr -d '\r')"
          echo "$out"
          test "$out" = "Unused Font"

      # Why the tool is compiled at all: the Groovy scripts it replaces took about four seconds
      # to print a help screen. Not a cold start in the strict sense — native-smoke ran this
      # binary a few steps ago, so it is page-cached; what is measured is the first --version run
      # and the steady state over 50 of them. The 200 ms ceiling is asserted rather than just
      # recorded, so a regression cannot pass silently.
      - name: Measure startup
        run: |
          # bash's `time` and awk both take the decimal separator from the locale. Scoped to this
          # step: a job-wide LC_ALL=C would give the JVM an ASCII sun.jnu.encoding and break the
          # non-ASCII file names the acceptance runs above depend on.
          export LC_ALL=C
          bin="$PWD/${{ matrix.binary }}"
          TIMEFORMAT='%3R'
          first="$( { time "$bin" --version > /dev/null ; } 2>&1 )"
          loop="$( { time ( i=0; while [ "$i" -lt 50 ]; do "$bin" --version > /dev/null; i=$((i + 1)); done ) ; } 2>&1 )"
          read -r first_ms mean_ms <<< "$(awk -v f="$first" -v l="$loop" 'BEGIN { printf "%.1f %.1f", f * 1000, l * 1000 / 50 }')"
          echo "startup ${{ matrix.label }}: first --version ${first_ms} ms, mean of 50 ${mean_ms} ms"
          # A `time` line this could not parse leaves the numbers empty, and an empty value
          # compares as a string against the ceiling below and passes. Refuse instead.
          case "$first_ms$mean_ms" in
            "" | *[!0-9.]*)
              echo "*** could not measure startup: time reported first=[$first] loop=[$loop]"
              exit 1
              ;;
          esac
          {
            echo "### Startup: ${{ matrix.label }}"
            echo
            echo "- first \`--version\`: ${first_ms} ms"
            echo "- mean of 50 runs: ${mean_ms} ms"
          } >> "$GITHUB_STEP_SUMMARY"
          if ! awk -v m="$mean_ms" 'BEGIN { exit (m > 200) ? 1 : 0 }'; then
            echo "*** startup ceiling exceeded: ${mean_ms} ms mean against a 200 ms ceiling"
            exit 1
          fi

      # Releases ship an unsigned Windows binary for now, and the install instructions say so.
      # When that changes, signing belongs here - before archiving, since the signature rides
      # inside the exe and survives zipping - or as a step against the bare exe uploaded below,
      # which is the same tested binary with a signature appended. Either way a published asset
      # is never re-signed in place: the next version gets the signature, because anything that
      # pinned the old checksum would start failing.
      - name: Note the unsigned Windows binary
        if: matrix.label == 'windows-x64'
        run: |
          echo "::notice title=Unsigned Windows binary::The zip holds an unsigned mkvtool.exe, which is the current release policy. The install instructions say so, and the checksums file is the verification path."

      # Packaged in the leg that just tested this binary rather than centrally, so the archive
      # holds the exact file the smoke probes, the acceptance cases, the fonts check and the
      # startup measurement all ran. The Gradle task reads what is on disk and does not depend
      # on nativeCompile, so nothing is rebuilt here.
      - name: Package the release archive
        run: |
          ./gradlew releaseArchive
          ls -l build/release
          # Gradle derives the platform label from the machine it runs on. This is where that
          # derivation is checked against what the leg claims to be building, so a toolchain
          # mix-up fails here instead of reaching a release page as a mislabelled asset.
          ls build/release | grep -q -- '-${{ matrix.label }}\.'

      # Only when something downstream will consume it. The packaging step above runs on every
      # native build regardless, so a broken archive task is caught by the weekly canary rather
      # than discovered on release day.
      - name: Upload the release archive
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          # Unique per leg: an artifact is immutable, so two legs writing one name is an error.
          name: release-${{ matrix.label }}
          path: build/release/
          if-no-files-found: error

      # The bare exe as well, unarchived, because signing happens elsewhere: the signer needs
      # this exact tested file. Signing appends to the PE rather than rebuilding it, so an
      # archive rebuilt around the signed copy still holds the binary these steps ran.
      - name: Upload the unsigned Windows binary
        if: |
          matrix.label == 'windows-x64' &&
          (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-unsigned-exe
          path: ${{ matrix.binary }}
          archive: false
          if-no-files-found: error

  release:
    # Collects the six release assets from the artifacts the jobs above uploaded, and on a
    # pushed v* tag creates a DRAFT release from them. Nothing here publishes: --draft is
    # unconditional, so a human sees every asset before any user can reach one. A dispatch runs
    # everything except that one call and leaves the assets as a workflow artifact, which is how
    # the whole path gets rehearsed without spending a tag. It needs no JDK: the version arrives
    # as a job output and the archives arrive built.
    needs: [build, harness-app, native]
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Release assets
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    defaults:
      run:
        shell: bash
    steps:
      # Asked once already in `build`, and asked again here, where the tag actually names a
      # release rather than merely accompanying a run.
      - name: Check the tag against the project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          case "$VERSION" in
            *-SNAPSHOT)
              echo "*** refusing to release $VERSION"
              exit 1
              ;;
          esac
          test "$TAG" = "v$VERSION"

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: assets

      # The asset list is a contract — package manifests pin these URLs and their checksums —
      # so it is asserted whole rather than spot-checked. A leg that stopped uploading, or a
      # platform label that came out wrong, surfaces here instead of as a missing download link.
      - name: Check the asset set
        working-directory: assets
        run: |
          expected="$(printf '%s\n' \
            "mkvtool-$VERSION-linux-x64.tar.gz" \
            "mkvtool-$VERSION-macos-arm64.tar.gz" \
            "mkvtool-$VERSION-macos-x64.tar.gz" \
            "mkvtool-$VERSION-windows-x64.zip" \
            "mkvtool-$VERSION.jar" | sort)"
          actual="$(ls -1 | sort)"
          if [ "$expected" != "$actual" ]; then
            echo "*** the asset set does not match the release contract"
            diff <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi

      # Flat archives holding an executable binary are two promises the install instructions
      # make. Both are cheap to check here and expensive to learn from a bug report.
      - name: Check the archive contents
        working-directory: assets
        run: |
          for archive in mkvtool-"$VERSION"-linux-x64.tar.gz \
                         mkvtool-"$VERSION"-macos-arm64.tar.gz \
                         mkvtool-"$VERSION"-macos-x64.tar.gz; do
            echo "::group::$archive"
            tar -tzvf "$archive"
            echo "::endgroup::"
            test "$(tar -tzf "$archive" | sort | tr '\n' ' ')" = "LICENSE README.txt mkvtool "
            tar -tzvf "$archive" | grep -qE '^-rwxr-xr-x .*[ /]mkvtool$'
          done
          # python3 rather than unzip: GNU tar cannot read a zip, and unzip is not part of a
          # stock Ubuntu — it happens to be on this image, but python3 is guaranteed and lists
          # the entries just as exactly.
          zip="mkvtool-$VERSION-windows-x64.zip"
          names="$(python3 -c 'import sys, zipfile; print(" ".join(sorted(zipfile.ZipFile(sys.argv[1]).namelist())))' "$zip")"
          echo "$zip: $names"
          test "$names" = "LICENSE README.txt mkvtool.exe"

      # Generated once, here, and only on Linux: sha256sum does not exist on a macOS runner, and
      # PowerShell's Get-FileHash prints a different format in a different encoding. Written
      # outside the directory and moved in, because the shell creates a redirect target *before*
      # the glob expands — written in place, the file would list itself. Bare names, so
      # `sha256sum -c` works from whatever directory a user downloaded into.
      - name: Write the checksums file
        working-directory: assets
        run: |
          sums="mkvtool-$VERSION-checksums.txt"
          sha256sum -- * > "$RUNNER_TEMP/$sums"
          mv "$RUNNER_TEMP/$sums" .
          sha256sum -c "$sums"
          cat "$sums"

      # Uploaded on every run of this job, rehearsal or not: on a dispatch it is the rehearsal's
      # entire output, and on a tag it is where the signer takes the Windows zip from.
      - name: Upload the asset set
        uses: actions/upload-artifact@v7
        with:
          name: mkvtool-${{ needs.build.outputs.version }}-assets
          path: assets/
          if-no-files-found: error
          retention-days: 14

      - name: Create the draft release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        working-directory: assets
        run: |
          # --draft, always. --verify-tag so a wrong tag fails rather than being created as a
          # side effect. Re-runnable: a second attempt uploads over the first instead of failing
          # on an existing release. Re-cutting is safe only while the release is still a draft —
          # once it is published, a bad build gets a new patch version, never a re-pushed tag,
          # because anything that pinned the old checksum would start failing verification.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" --clobber -- *
          else
            gh release create "$TAG" --draft --verify-tag \
              --title "mkvtool $VERSION" \
              --notes "Draft. Release notes are written by hand before publishing." \
              -- *
          fi
          {
            echo "### Draft release $TAG"
            echo
            echo "Still owed before publishing:"
            echo "- [ ] write the release notes, with the codename"
            echo "- [ ] check the assets against the install instructions"
            echo
            echo "The Windows exe ships unsigned by current policy. If that changes for this"
            echo "release, sign the bare exe from this run, rebuild its zip with"
            echo "\`releaseArchive -PnativeBinary=<signed exe>\`, upload with \`--clobber\`, and"
            echo "regenerate \`mkvtool-$VERSION-checksums.txt\` over the final assets."
          } >> "$GITHUB_STEP_SUMMARY"
