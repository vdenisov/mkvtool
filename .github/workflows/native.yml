name: Native and release

# The whole of CI for mkvtool. It was once one of two workflows, the other holding the v1 Groovy
# scripts' own legs; those scripts are gone and so is that file. Seven jobs with different cadences:
#   build            - fast Linux JVM build + unit tests, on every push-to-main and PR. Also
#                      reads the project version, which the release job consumes.
#   harness-app      - the acceptance suite against the JVM launcher, plus a smaller pass over
#                      the fat jar, on every push-to-main and PR.
#   harness-upstream - the same suite against the newest MKVToolNix instead of the distro
#                      package: the canary for mkvmerge's own output. Merge, weekly schedule
#                      and dispatch, never a PR - a new mkvmerge release is not something a
#                      pull request caused, and a check that reddens for reasons the author
#                      cannot act on is a check people learn to ignore.
#   live-contract    - the one case that calls the real TheMovieDB API, on the schedule and on
#                      dispatch only. Same reasoning as harness-upstream, one step further: it
#                      answers "has the API changed shape", which no commit asks.
#   native           - the slow GraalVM native-image build for Windows x64 and both macOS
#                      architectures, its smoke probes, the acceptance runs against the
#                      resulting binary and the packaging of that binary into its release
#                      archive; only on merge (push to main), a pushed v* tag, the weekly
#                      schedule and manual dispatch. Native config rarely changes and each
#                      compile is minutes per OS, so it does not run per PR commit. Runner
#                      minutes are free (public repo), so this is about CI noise, not cost.
#                      Verify a branch by dispatching this workflow against it.
#   native-linux     - the same, for Linux, on the same cadence. A leg of `native` in
#                      everything but YAML: it is a job of its own only because it runs inside
#                      the build-environment image, and a container cannot be turned off for
#                      one entry of a matrix.
#   release          - collects those archives, the jar and a checksums file. On a pushed v*
#                      tag it creates a DRAFT release from them; on a dispatch it leaves them
#                      as a workflow artifact and touches no release at all, which is how the
#                      whole path is rehearsed without spending a tag.
#
# `native-linux` is the one job that runs inside the pinned build-environment image, because it
# is the one job whose environment reaches users: native-image links against the glibc of
# whatever compiles it, so pinning that host is what stops `ubuntu-latest` moving the released
# Linux binary's minimum supported glibc without a commit behind it. The pin also makes that leg
# and a developer's `docker compose run --rm build ./gradlew nativeLoop` the same run. Every
# other job stays on a plain runner deliberately: `build` on a stock Temurin is the one leg
# proving the published fat jar builds without GraalVM, `harness-upstream` exists to be
# unpinned, and `harness-app` is a JVM tier whose environment is not part of what it tests -
# any JDK 21, mkvmerge and Groovy will do, and nothing a user receives is built there.
#
# The acceptance harness is still Groovy, which is why four jobs install it; that is the last
# Groovy in the repository and it is being translated to a Kotlin end-to-end tier.
#
# Nothing here ever publishes: a tag creates a draft, and a draft's assets need a token to
# download, so a human sees every asset first. The Windows leg uploads the bare exe on its own
# so a signature can later be appended to the binary that was actually tested; today it ships
# unsigned, and the install instructions say so.
on:
  push:
    branches: [main]
    # A v* tag is a release attempt. A tag push carries no branch, so the filter above does
    # not apply to it.
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    # Weekly canary: catches a GraalVM/base-image change that breaks the native build
    # without any commit here.
    - cron: "0 7 * * 1"
  workflow_dispatch:

# Read by default. Only the release job widens this, and only to attach assets to a draft.
permissions:
  contents: read

jobs:
  build:
    # Everything except the weekly schedule, which runs the native legs and the upstream
    # canary - neither needs this job.
    if: github.event_name != 'schedule'
    # On a stock Temurin, deliberately: this is the one leg that proves the published fat jar
    # builds on a plain JDK 21 - the JDK every user of that jar actually has - rather than on
    # the build-environment image's GraalVM.
    runs-on: ubuntu-latest
    name: Build + unit tests (JDK 21)
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # Ordinary JVM build: compile, unit tests, and the shadow jar. No GraalVM and no
      # MKVToolNix — the unit tier fakes probe data and the native-smoke probe uses
      # neither mkvmerge nor a native image here.
      - name: Build and test
        run: ./gradlew build

      # Read from the build rather than parsed out of gradle.properties, so there is one
      # implementation of "what version is this" — the one that also names every archive.
      # Published as a job output, which is what lets the release job run with no JDK at all.
      - name: Read the project version
        id: version
        run: |
          version="$(./gradlew -q printVersion | tail -n1 | tr -d '\r')"
          # An unparsable value would otherwise flow into asset names and compare as a string
          # against the tag below, matching nothing and explaining nothing.
          case "$version" in
            "" | *[!0-9A-Za-z.-]*)
              echo "*** could not read the project version: [$version]"
              exit 1
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "project version: $version"

      # A tag push is a release attempt, and this refuses a mismatched one a minute in rather
      # than after four native legs have spent twenty minutes building assets nobody can use.
      # The release job asks again, because that is where the tag actually names a release.
      - name: Check the tag against the project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${{ steps.version.outputs.version }}"
          case "$version" in
            *-SNAPSHOT)
              echo "*** refusing to release $version: stamp the real version in gradle.properties first"
              exit 1
              ;;
          esac
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "*** tag $GITHUB_REF_NAME does not match the project version $version"
            exit 1
          fi

  harness-app:
    # The end-to-end coverage, and a required check. The unit tier is in-process by contract - faked
    # probes, no mkvmerge, no subprocess - so these are the runs that drive a real binary against
    # real MKV files and assert through `mkvmerge -J`.
    #
    # Two suites do that here, deliberately, for as long as the migration takes: the Groovy harness
    # that was the port's oracle against the v1 scripts, and the Kotlin `e2eTest` tier replacing it
    # case by case. The cases outlived the scripts they pinned and are being moved rather than
    # dropped. This job also carries the fat jar's only coverage, at the end.
    #
    # It carries the fat jar's only coverage too, at the end: MKVToolNix, Groovy and the
    # Grapes cache are already paid for here, and a job of its own would spend three minutes
    # of setup to run bytecode this one already ran.
    #
    # Plain host installs, not the build-environment image. This is a JVM tier: what it tests
    # is bytecode, any JDK 21 with any mkvmerge and Groovy will do, and nothing a user
    # receives is built here - so the image would buy this leg a container pull on every PR
    # and nothing else. The distro mkvtoolnix installed below is the same version the image
    # pins anyway (both resolve from the same Ubuntu release); the deliberately unpinned end
    # of that axis is harness-upstream.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    name: Acceptance harness (JVM launcher and fat jar)
    env:
      GROOVY_VERSION: "5.0.6"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # The harness needs mkvmerge at startup and asserts output via mkvmerge -J; mkvpropedit
      # keeps the propedit cases from self-skipping. Which version ran is
      # part of what the run proves, so it goes into the summary rather than only the log.
      - name: Install MKVToolNix
        run: |
          sudo apt-get update
          sudo apt-get install -y mkvtoolnix
          mkvmerge --version
          mkvpropedit --version
          {
            echo "### mkvmerge"
            echo
            echo "\`$(mkvmerge --version | head -n1)\` — the distro package"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cache Groovy distribution
        uses: actions/cache@v6
        with:
          path: ~/groovy
          key: groovy-${{ env.GROOVY_VERSION }}

      - name: Install Groovy
        run: |
          if [ ! -d "$HOME/groovy/groovy-${{ env.GROOVY_VERSION }}" ]; then
            curl -fsSL -o /tmp/groovy.zip "https://archive.apache.org/dist/groovy/${{ env.GROOVY_VERSION }}/distribution/apache-groovy-binary-${{ env.GROOVY_VERSION }}.zip"
            mkdir -p "$HOME/groovy"
            unzip -q /tmp/groovy.zip -d "$HOME/groovy"
          fi
          echo "$HOME/groovy/groovy-${{ env.GROOVY_VERSION }}/bin" >> "$GITHUB_PATH"

      - name: Cache Grapes
        uses: actions/cache@v6
        with:
          path: ~/.groovy/grapes
          key: grapes-${{ env.GROOVY_VERSION }}-${{ hashFiles('src/**/*.groovy') }}
          restore-keys: |
            grapes-${{ env.GROOVY_VERSION }}-

      # The launcher the harness invokes (build/install/mkvtool/bin/mkvtool), and the one
      # that runs the fat jar (build/jar-launcher/mkvtool), which also builds the jar.
      - name: Build the JVM launcher and the fat-jar launcher
        run: ./gradlew installDist jarLauncher

      # Through the Gradle task rather than by invoking the harness directly, for the reason the
      # native legs do: one implementation of "run the suite against this binary", callable on a
      # developer machine. -PnativeBinary names whatever is being verified - here a JVM launcher -
      # and the task adds two things a bare harness invocation lacks: the work-directory lock,
      # and a check that any cases ran at all.
      #
      # Groovy travels as the -PgroovyBin property, never via PATH: the Gradle daemon keeps the
      # environment it started with, so a tool installed after any earlier ./gradlew step is
      # invisible to everything the daemon spawns, while a property arrives with each invocation.
      - name: Run acceptance harness against the app
        run: ./gradlew acceptanceTest -PnativeBinary=build/install/mkvtool/bin/mkvtool "-PgroovyBin=$HOME/groovy/groovy-$GROOVY_VERSION/bin/groovy"

      # The Kotlin end-to-end tier, which is replacing the Groovy suite above case by case. Both run
      # for the duration of that migration: two suites in parallel is the cost of moving 124 cases
      # without a window where neither covers something. No Groovy and no extra install - it drives
      # the same launcher the step above does, and takes its temp directories from Kotest rather than
      # from the harness's shared scratch directory, so the two do not contend.
      - name: Run the end-to-end tier
        run: ./gradlew e2eTest

      # The fat jar is published as the JVM fallback and no tier ran it: the step above covers
      # the same bytecode through the installDist launcher, and the native legs cover it
      # compiled. What only the jar can break is its own packaging — the Main-Class manifest
      # and the resources merged from several dependencies — so native-smoke does most of the
      # work here (it decodes a charset, reads a CLDR name, parses JSON and round-trips YAML
      # inside the process), and three cases put real files, a real mkvmerge call and
      # non-ASCII names through the CLI. Run after the full suite, never beside it: the
      # harness keys its work directories by case name and recreates them at case start, so
      # two concurrent suites wipe each other's fixtures — which the task's lock enforces
      # rather than leaving to the order of these steps.
      - name: Smoke-test the fat jar
        run: |
          launcher=build/jar-launcher/mkvtool
          "$launcher" --version
          "$launcher" native-smoke
          cases=(
            # a real mkvmerge invocation end to end
            01_one_audio_one_subtitle
            # a windows-1251 decode through the CLI, i.e. the charset resources survived shading
            50_to_utf8_converts_in_place
            # Cyrillic through fetch, rename and file names
            38_non_ascii_titles_round_trip
          )
          failed=""
          for case_name in "${cases[@]}"; do
            echo "::group::$case_name"
            # -Pfilter through the task, so a case renamed out from under this list fails here
            # instead of running nothing and exiting 0.
            if ! ./gradlew acceptanceTest -PnativeBinary="$launcher" -Pfilter="$case_name" "-PgroovyBin=$HOME/groovy/groovy-$GROOVY_VERSION/bin/groovy"; then
              failed="$failed $case_name"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "*** Fat-jar cases failed:$failed"
            exit 1
          fi

      # The jar attached to a release is the one this job just tested, for the same reason
      # each native archive is packaged in the leg that tested its binary.
      - name: Package the release jar
        run: ./gradlew releaseJar

      # As on the native legs: packaged every run so the task cannot rot unnoticed, uploaded only
      # when the release job will collect it.
      - name: Upload the release jar
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: release-jar
          path: build/release/
          if-no-files-found: error

  harness-upstream:
    # The moving end of the mkvmerge version axis: the same oracle, the same launcher, the newest
    # MKVToolNix instead of the distro package harness-app runs. It answers "did a new mkvmerge
    # change its output under us", which has already paid for itself once - ${codec} keys on
    # codec_id rather than on mkvmerge's display string *because* the display string changed
    # between versions, and a two-version axis is what surfaced it.
    #
    # It began as a leg of the deleted Groovy workflow, testing the scripts. It was re-homed onto the
    # binary one task *before* that deletion, deliberately: while both still existed a red run could be
    # arbitrated by running the suite against each target on one mkvmerge, and the disagreement said
    # whether it was a port bug or a genuine mkvmerge change. After the deletion there is nothing left
    # to arbitrate against, which is why the move could not wait.
    #
    # A job of its own rather than a matrix dimension on harness-app, because the two ends of the
    # axis run on different cadences: merge, schedule and dispatch only here. A new MKVToolNix
    # release is not something a pull request caused, and a red check its author cannot act on is
    # one they learn to scroll past.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    name: Acceptance harness (upstream mkvmerge)
    env:
      GROOVY_VERSION: "5.0.6"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build the JVM launcher
        run: ./gradlew installDist

      - name: Install MKVToolNix (upstream)
        run: |
          sudo mkdir -p /etc/apt/keyrings
          sudo wget -q -O /etc/apt/keyrings/gpg-pub-moritzbunkus.gpg https://mkvtoolnix.download/gpg-pub-moritzbunkus.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/gpg-pub-moritzbunkus.gpg] https://mkvtoolnix.download/ubuntu/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/mkvtoolnix.download.list
          sudo apt-get update
          sudo apt-get install -y mkvtoolnix
          mkvmerge --version
          mkvpropedit --version
          # The point of this leg is which version it ran, so it is evidence rather than a log line.
          {
            echo "### mkvmerge"
            echo
            echo "\`$(mkvmerge --version | head -n1)\` — newest upstream, deliberately unpinned"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cache Groovy distribution
        uses: actions/cache@v6
        with:
          path: ~/groovy
          key: groovy-${{ env.GROOVY_VERSION }}

      - name: Install Groovy
        run: |
          if [ ! -d "$HOME/groovy/groovy-${{ env.GROOVY_VERSION }}" ]; then
            curl -fsSL -o /tmp/groovy.zip "https://archive.apache.org/dist/groovy/${{ env.GROOVY_VERSION }}/distribution/apache-groovy-binary-${{ env.GROOVY_VERSION }}.zip"
            mkdir -p "$HOME/groovy"
            unzip -q /tmp/groovy.zip -d "$HOME/groovy"
          fi
          echo "$HOME/groovy/groovy-${{ env.GROOVY_VERSION }}/bin" >> "$GITHUB_PATH"

      - name: Cache Grapes
        uses: actions/cache@v6
        with:
          path: ~/.groovy/grapes
          key: grapes-${{ env.GROOVY_VERSION }}-${{ hashFiles('src/**/*.groovy') }}
          restore-keys: |
            grapes-${{ env.GROOVY_VERSION }}-

      # Groovy travels as the -PgroovyBin property, never via PATH: the Gradle daemon keeps the
      # native environment it started with - here the launcher-build step, before Groovy was
      # installed - so a PATH entry added afterwards is invisible to everything the daemon
      # spawns, while a property arrives with each invocation.
      - name: Run the acceptance harness against the app
        run: ./gradlew acceptanceTest -PnativeBinary=build/install/mkvtool/bin/mkvtool "-PgroovyBin=$HOME/groovy/groovy-$GROOVY_VERSION/bin/groovy"

  live-contract:
    # The one case that calls the real TheMovieDB API. It answers "has the API changed shape", which
    # is a weekly-signal question no commit asks - so, like harness-upstream, it never runs on a push
    # or a PR: network flakiness that reddens the badge on every push trains you to ignore the badge,
    # which is worse than having no badge.
    #
    # It lived in the deleted Groovy workflow and ran the scripts there. It is the *case* that
    # survived rather than the job: the case exercises whichever binary it is pointed at, and here it
    # is pointed at the JVM launcher. Moving it was not optional - the workflow that scheduled it is
    # gone, and an unscheduled job is a test that silently stops running.
    #
    # The case skips itself when no key is resolvable, so this job passes rather than fails when
    # TMDB_API_KEY is unset - which is also what happens on PRs from forks, where GitHub withholds
    # secrets by design.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: TheMovieDB live contract
    env:
      GROOVY_VERSION: "5.0.6"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build the JVM launcher
        run: ./gradlew installDist

      # The harness resolves mkvmerge at startup and asserts if it cannot, even when filtered down
      # to a single case that never calls it.
      - name: Install MKVToolNix
        run: |
          sudo apt-get update
          sudo apt-get install -y mkvtoolnix
          mkvmerge --version

      - name: Cache Groovy distribution
        uses: actions/cache@v6
        with:
          path: ~/groovy
          key: groovy-${{ env.GROOVY_VERSION }}

      - name: Install Groovy
        run: |
          if [ ! -d "$HOME/groovy/groovy-${{ env.GROOVY_VERSION }}" ]; then
            curl -fsSL -o /tmp/groovy.zip "https://archive.apache.org/dist/groovy/${{ env.GROOVY_VERSION }}/distribution/apache-groovy-binary-${{ env.GROOVY_VERSION }}.zip"
            mkdir -p "$HOME/groovy"
            unzip -q /tmp/groovy.zip -d "$HOME/groovy"
          fi
          echo "$HOME/groovy/groovy-${{ env.GROOVY_VERSION }}/bin" >> "$GITHUB_PATH"

      - name: Cache Grapes
        uses: actions/cache@v6
        with:
          path: ~/.groovy/grapes
          key: grapes-${{ env.GROOVY_VERSION }}-${{ hashFiles('src/**/*.groovy') }}
          restore-keys: |
            grapes-${{ env.GROOVY_VERSION }}-

      # Through the Gradle task rather than by invoking the harness directly, as every other leg
      # does: -Pfilter goes through the task's "did any case actually run" guard, so a case renamed
      # out from under this job fails here instead of running nothing and exiting 0. Groovy travels
      # as -PgroovyBin, never via PATH - the daemon started by the launcher build above predates the
      # install step and keeps that environment.
      - name: Run the live contract case
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          ./gradlew acceptanceTest \
            -PnativeBinary=build/install/mkvtool/bin/mkvtool \
            -Pfilter=37_fetch_episodes_live_contract \
            "-PgroovyBin=$HOME/groovy/groovy-$GROOVY_VERSION/bin/groovy"

  native:
    # Merge (push is main-only via the branch filter) + weekly schedule + manual. These legs and
    # native-linux below are the only ones that exercise the *native* binary — harness-app covers
    # the JVM launcher — so the acceptance runs live here rather than in a job of their own, next
    # to the binary they need. The weekly canary therefore also re-checks acceptance, which is
    # what would catch a GraalVM update changing behavior rather than just breaking the build.
    #
    # Windows and macOS keep their choco and brew installs permanently: a Linux image cannot serve
    # them, so what these legs contribute is OS spread at one mkvmerge version, while the version
    # spread lives on Linux (harness-app and harness-upstream). Since choco and brew both track
    # releases closely, they land in the same version class as the upstream leg — which is what
    # makes a Windows-only failure attributable, once each leg records the version it ran.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            binary: build/native/nativeCompile/mkvtool.exe
          - os: macos-latest
            label: macos-arm64
            binary: build/native/nativeCompile/mkvtool
          # GraalVM does not cross-compile, so an Intel binary needs an Intel host. The
          # -intel labels are the standard runner tier, free for public repositories; the
          # -large and -xlarge variants are the billed one. This image line is the last
          # x86_64 one GitHub has announced, scheduled to end around August 2027 — after
          # that this asset needs another host or gets dropped.
          - os: macos-15-intel
            label: macos-x64
            binary: build/native/nativeCompile/mkvtool
    runs-on: ${{ matrix.os }}
    name: Native ${{ matrix.label }}
    # A leg finishes well inside this. The ceiling is here because native-image can *hang*
    # rather than fail on macOS x64, and the six-hour default would sit on a runner for the
    # rest of the day before saying so.
    timeout-minutes: 45
    env:
      GROOVY_VERSION: "5.0.6"
    defaults:
      run:
        # Git Bash is present on the Windows runner too, so one script runs everywhere.
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # GraalVM CE (license-clean for an OSS project); installs native-image. The token
      # avoids anonymous GitHub download rate limits.
      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: "21"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: gradle/actions/setup-gradle@v6

      # An Intel runner and an Intel toolchain are two separate claims: setup-graalvm picks
      # its download from the host architecture, and an arm64 JDK on an Intel host would
      # produce a binary that runs under Rosetta and reports the wrong architecture. Checked
      # on both macOS legs, so the mirror mistake is caught too, and checked *before* the
      # compile so a wrong JDK costs a minute instead of twenty.
      - name: Check the toolchain architecture
        if: runner.os == 'macOS'
        run: |
          case "${{ matrix.label }}" in
            *-x64)   want_uname=x86_64 ; want_arch=x86_64  ;;
            *-arm64) want_uname=arm64  ; want_arch=aarch64 ;;
          esac
          uname -m
          java -XshowSettings:properties -version 2>&1 | grep -E 'os\.arch|java\.vendor'
          test "$(uname -m)" = "$want_uname"
          java -XshowSettings:properties -version 2>&1 | grep -qE "os\.arch = $want_arch\$"

      - name: Build native image
        run: ./gradlew nativeCompile

      # The same question asked of the artifact rather than of the toolchain. An arm64 build
      # published under an x64 name is the one outcome worse than not publishing the asset,
      # and nothing downstream can tell the difference by looking at the file name.
      - name: Check the binary architecture
        if: runner.os == 'macOS'
        run: |
          case "${{ matrix.label }}" in
            *-x64)   want=x86_64 ;;
            *-arm64) want=arm64  ;;
          esac
          file -b "${{ matrix.binary }}"
          file -b "${{ matrix.binary }}" | grep -q "$want"

      # The harness needs mkvmerge at startup and asserts output via mkvmerge -J; mkvpropedit
      # is what keeps the propedit cases from self-skipping.
      - name: Install MKVToolNix
        run: |
          case "$RUNNER_OS" in
            macOS)
              HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install mkvtoolnix
              ;;
            Windows)
              choco install mkvtoolnix --yes --no-progress
              # A choco install does not reach this job's already-started PATH, so add the
              # installer's fixed location by hand: in Windows form for the later steps, whose
              # PATH lookups happen inside the JVM and the native binary, and in POSIX form for
              # the two proof lines below, which bash resolves. (Even without either, both
              # findMkvTool implementations fall back to this very directory on Windows.)
              echo "C:\Program Files\MKVToolNix" >> "$GITHUB_PATH"
              export PATH="/c/Program Files/MKVToolNix:$PATH"
              ;;
          esac
          mkvmerge --version
          mkvpropedit --version
          # Recorded, not merely printed. Which version a leg ran is part of what the run proves:
          # choco and brew track releases closely, so these land in the same version class as the
          # upstream leg, and that is what leaves the OS as the only explanation for an OS-only
          # failure.
          {
            echo "### mkvmerge"
            echo
            echo "\`$(mkvmerge --version | head -n1)\` — whatever this platform's package manager ships"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cache Groovy distribution
        uses: actions/cache@v6
        with:
          path: ~/groovy
          # Keyed on the leg's label, not on runner.os: the two macOS legs would otherwise
          # share one key and race each other for it.
          key: groovy-${{ env.GROOVY_VERSION }}-${{ matrix.label }}

      - name: Install Groovy
        run: |
          if [ ! -d "$HOME/groovy/groovy-$GROOVY_VERSION" ]; then
            curl -fsSL -o /tmp/groovy.zip "https://archive.apache.org/dist/groovy/$GROOVY_VERSION/distribution/apache-groovy-binary-$GROOVY_VERSION.zip"
            mkdir -p "$HOME/groovy"
            # `jar` rather than `unzip`: Git Bash on the Windows runner ships no unzip, while
            # setup-graalvm guarantees a JDK (and its bin on PATH) on every leg.
            (cd "$HOME/groovy" && jar xf /tmp/groovy.zip)
          fi
          # `jar` extracts without the zip entries' Unix modes, so the launchers come out
          # non-executable and Linux/macOS fail with exit 126 (`unzip` would have kept them).
          # Outside the guard above on purpose: the cache can hold a tree unpacked this way.
          chmod +x "$HOME/groovy/groovy-$GROOVY_VERSION/bin"/*
          # Named rather than put on PATH: the launcher is invoked from bash on all three
          # runners, and a bash-style path in GITHUB_PATH would mean nothing to another shell.
          echo "GROOVY=$HOME/groovy/groovy-$GROOVY_VERSION/bin/groovy" >> "$GITHUB_ENV"

      - name: Cache Grapes
        uses: actions/cache@v6
        with:
          path: ~/.groovy/grapes
          key: grapes-${{ env.GROOVY_VERSION }}-${{ matrix.label }}-${{ hashFiles('src/**/*.groovy') }}
          restore-keys: |
            grapes-${{ env.GROOVY_VERSION }}-${{ matrix.label }}-

      # Everything done to the binary just built, as one Gradle task rather than four steps of
      # workflow shell: the built-in probes (which prove -H:+AddAllCharsets and
      # -H:+IncludeAllLocales survived into this OS's image), the find-unused-fonts check that no
      # oracle case covers, the acceptance suite against the binary, and the `--version` startup
      # measurement against its ceiling. The point of it being a task is that the same
      # verification runs on a developer machine, so local and CI cannot drift into two answers.
      # The task also guards two failures that fail *open* in hand-rolled shell: a `--filter`
      # matching nothing runs no cases and exits 0, and a startup measurement that does not check
      # `--version`'s exit code lets a binary that fails fast beat the ceiling.
      #
      # -Pacceptance=smoke on all three: one representative case per command rather than the whole
      # suite, because these legs exist to catch what differs *per OS* in a native image, and 124
      # cases apiece would triple them for coverage native-linux already provides in full.
      #
      # $GROOVY is read by the task, exported by the Install Groovy step above. No -PnativeBinary:
      # the default is host-aware (mkvtool.exe on Windows), which keeps this the same command a
      # developer types.
      - name: Verify the native binary
        run: ./gradlew nativeCheck -Pacceptance=smoke

      # Releases ship an unsigned Windows binary for now, and the install instructions say so.
      # When that changes, signing belongs here - before archiving, since the signature rides
      # inside the exe and survives zipping - or as a step against the bare exe uploaded below,
      # which is the same tested binary with a signature appended. Either way a published asset
      # is never re-signed in place: the next version gets the signature, because anything that
      # pinned the old checksum would start failing.
      - name: Note the unsigned Windows binary
        if: matrix.label == 'windows-x64'
        run: |
          echo "::notice title=Unsigned Windows binary::The zip holds an unsigned mkvtool.exe, which is the current release policy. The install instructions say so, and the checksums file is the verification path."

      # Packaged in the leg that just tested this binary rather than centrally, so the archive
      # holds the exact file the smoke probes, the acceptance cases, the fonts check and the
      # startup measurement all ran. The Gradle task reads what is on disk and does not depend
      # on nativeCompile, so nothing is rebuilt here.
      - name: Package the release archive
        run: |
          ./gradlew releaseArchive
          ls -l build/release
          # Gradle derives the platform label from the machine it runs on. This is where that
          # derivation is checked against what the leg claims to be building, so a toolchain
          # mix-up fails here instead of reaching a release page as a mislabelled asset.
          ls build/release | grep -q -- '-${{ matrix.label }}\.'

      # Only when something downstream will consume it. The packaging step above runs on every
      # native build regardless, so a broken archive task is caught by the weekly canary rather
      # than discovered on release day.
      - name: Upload the release archive
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          # Unique per leg: an artifact is immutable, so two legs writing one name is an error.
          name: release-${{ matrix.label }}
          path: build/release/
          if-no-files-found: error

      # The bare exe as well, unarchived, because signing happens elsewhere: the signer needs
      # this exact tested file. Signing appends to the PE rather than rebuilding it, so an
      # archive rebuilt around the signed copy still holds the binary these steps ran.
      - name: Upload the unsigned Windows binary
        if: |
          matrix.label == 'windows-x64' &&
          (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-unsigned-exe
          path: ${{ matrix.binary }}
          archive: false
          if-no-files-found: error

  native-linux:
    # The Linux leg of `native`, on the same cadence and doing the same things in the same order.
    # It is a job of its own for one mechanical reason: it runs inside the build-environment image,
    # a job's container cannot be turned off for a single matrix entry, and Windows and macOS
    # runners cannot start a Linux image.
    #
    # Two things follow from the pin that the matrix legs do not get. native-image links against
    # the glibc of whatever compiles it, so pinning this host is what fixes the released Linux
    # binary's minimum supported glibc - `ubuntu-latest` moving to the next LTS would otherwise
    # raise it for every user with nothing here going red. And GraalVM, mkvmerge, Groovy and the
    # harness's Grape cache all come from the image, so this leg runs the same suite against the
    # same versions a developer's `docker compose run --rm build ./gradlew nativeLoop` does.
    #
    # It runs the *whole* oracle where the other three run one case per command: mkvtoolnix is
    # already in the image and the binary starts in about 13 ms, so 124 cases cost half a minute.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    container:
      # The same digest compose.yaml pins, spelled as a literal because `container:` is resolved
      # before any step runs and cannot read a value out of a file. The two homes are kept in step
      # by hand - the buildenv workflow's job summary prints both lines to paste, and moving the
      # pin is meant to be one reviewed commit touching both files.
      image: ghcr.io/vdenisov/mkvtool-buildenv@sha256:86dce58c681ae09bc2ba752a02a37a447c0dd75afa2c2501eca2e55f2b5111dc
      # The image sets `USER builder` so that files written through a local bind mount belong to
      # the developer. A job container is the other way round: the runner owns the workspace and
      # documents a non-root container user as unsupported, so CI - and only CI - enters the
      # environment as root.
      options: --user root
      # Harmless while the package is public, and the difference between working and an auth error
      # if it ever is not. GITHUB_TOKEN can read this repository's own packages.
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    name: Native linux-x64
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: gradle/actions/setup-gradle@v6

      - name: Record the mkvmerge version
        run: |
          mkvmerge --version
          mkvpropedit --version
          {
            echo "### mkvmerge"
            echo
            echo "\`$(mkvmerge --version | head -n1)\` — pinned by the build-environment image"
          } >> "$GITHUB_STEP_SUMMARY"

      # Two steps rather than the single `nativeLoop` a developer runs, only so that a compile
      # failure and a verification failure are told apart at a glance. nativeCompile then
      # nativeCheck is exactly what that task chains.
      - name: Build native image
        run: ./gradlew nativeCompile

      - name: Verify the native binary
        run: ./gradlew nativeCheck -Pacceptance=full

      # Same rules as the matrix legs above, for the same reasons: packaged where it was tested,
      # from what is on disk, with the derived platform label checked against what this leg claims
      # to be building.
      - name: Package the release archive
        run: |
          ./gradlew releaseArchive
          ls -l build/release
          ls build/release | grep -q -- '-linux-x64\.'

      - name: Upload the release archive
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-x64
          path: build/release/
          if-no-files-found: error

  release:
    # Collects the six release assets from the artifacts the jobs above uploaded, and on a
    # pushed v* tag creates a DRAFT release from them. Nothing here publishes: --draft is
    # unconditional, so a human sees every asset before any user can reach one. A dispatch runs
    # everything except that one call and leaves the assets as a workflow artifact, which is how
    # the whole path gets rehearsed without spending a tag. It needs no JDK: the version arrives
    # as a job output and the archives arrive built.
    needs: [build, harness-app, native, native-linux]
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Release assets
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    defaults:
      run:
        shell: bash
    steps:
      # Asked once already in `build`, and asked again here, where the tag actually names a
      # release rather than merely accompanying a run.
      - name: Check the tag against the project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          case "$VERSION" in
            *-SNAPSHOT)
              echo "*** refusing to release $VERSION"
              exit 1
              ;;
          esac
          test "$TAG" = "v$VERSION"

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: assets

      # The asset list is a contract — package manifests pin these URLs and their checksums —
      # so it is asserted whole rather than spot-checked. A leg that stopped uploading, or a
      # platform label that came out wrong, surfaces here instead of as a missing download link.
      - name: Check the asset set
        working-directory: assets
        run: |
          expected="$(printf '%s\n' \
            "mkvtool-$VERSION-linux-x64.tar.gz" \
            "mkvtool-$VERSION-macos-arm64.tar.gz" \
            "mkvtool-$VERSION-macos-x64.tar.gz" \
            "mkvtool-$VERSION-windows-x64.zip" \
            "mkvtool-$VERSION.jar" | sort)"
          actual="$(ls -1 | sort)"
          if [ "$expected" != "$actual" ]; then
            echo "*** the asset set does not match the release contract"
            diff <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi

      # Flat archives holding an executable binary are two promises the install instructions
      # make. Both are cheap to check here and expensive to learn from a bug report.
      - name: Check the archive contents
        working-directory: assets
        run: |
          for archive in mkvtool-"$VERSION"-linux-x64.tar.gz \
                         mkvtool-"$VERSION"-macos-arm64.tar.gz \
                         mkvtool-"$VERSION"-macos-x64.tar.gz; do
            echo "::group::$archive"
            tar -tzvf "$archive"
            echo "::endgroup::"
            test "$(tar -tzf "$archive" | sort | tr '\n' ' ')" = "LICENSE README.txt mkvtool "
            tar -tzvf "$archive" | grep -qE '^-rwxr-xr-x .*[ /]mkvtool$'
          done
          # python3 rather than unzip: GNU tar cannot read a zip, and unzip is not part of a
          # stock Ubuntu — it happens to be on this image, but python3 is guaranteed and lists
          # the entries just as exactly.
          zip="mkvtool-$VERSION-windows-x64.zip"
          names="$(python3 -c 'import sys, zipfile; print(" ".join(sorted(zipfile.ZipFile(sys.argv[1]).namelist())))' "$zip")"
          echo "$zip: $names"
          test "$names" = "LICENSE README.txt mkvtool.exe"

      # Generated once, here, and only on Linux: sha256sum does not exist on a macOS runner, and
      # PowerShell's Get-FileHash prints a different format in a different encoding. Written
      # outside the directory and moved in, because the shell creates a redirect target *before*
      # the glob expands — written in place, the file would list itself. Bare names, so
      # `sha256sum -c` works from whatever directory a user downloaded into.
      - name: Write the checksums file
        working-directory: assets
        run: |
          sums="mkvtool-$VERSION-checksums.txt"
          sha256sum -- * > "$RUNNER_TEMP/$sums"
          mv "$RUNNER_TEMP/$sums" .
          sha256sum -c "$sums"
          cat "$sums"

      # Uploaded on every run of this job, rehearsal or not: on a dispatch it is the rehearsal's
      # entire output, and on a tag it is where the signer takes the Windows zip from.
      - name: Upload the asset set
        uses: actions/upload-artifact@v7
        with:
          name: mkvtool-${{ needs.build.outputs.version }}-assets
          path: assets/
          if-no-files-found: error
          retention-days: 14

      - name: Create the draft release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        working-directory: assets
        run: |
          # --draft, always. --verify-tag so a wrong tag fails rather than being created as a
          # side effect. Re-runnable: a second attempt uploads over the first instead of failing
          # on an existing release. Re-cutting is safe only while the release is still a draft —
          # once it is published, a bad build gets a new patch version, never a re-pushed tag,
          # because anything that pinned the old checksum would start failing verification.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" --clobber -- *
          else
            gh release create "$TAG" --draft --verify-tag \
              --title "mkvtool $VERSION" \
              --notes "Draft. Release notes are written by hand before publishing." \
              -- *
          fi
          {
            echo "### Draft release $TAG"
            echo
            echo "Still owed before publishing:"
            echo "- [ ] write the release notes, with the codename"
            echo "- [ ] check the assets against the install instructions"
            echo
            echo "The Windows exe ships unsigned by current policy. If that changes for this"
            echo "release, sign the bare exe from this run, rebuild its zip with"
            echo "\`releaseArchive -PnativeBinary=<signed exe>\`, upload with \`--clobber\`, and"
            echo "regenerate \`mkvtool-$VERSION-checksums.txt\` over the final assets."
          } >> "$GITHUB_STEP_SUMMARY"
