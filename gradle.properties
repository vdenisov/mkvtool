# The project's own version, and nothing else the build resolves: every dependency and plugin
# version lives in gradle/libs.versions.toml. The split is not cosmetic — the catalog is what
# Dependabot can read, and a project version is not a dependency, so it has no place there.

# Project version. Surfaced at runtime via the generated org.plukh.mkvtool.BuildInfo, and it
# names every release archive - a `v*` tag is refused unless it reads exactly `v<version>`,
# and refused outright while this is a snapshot. Goes back to a snapshot after a release.
version=2.1.0-SNAPSHOT

# Build performance.
org.gradle.parallel=true
org.gradle.caching=true
