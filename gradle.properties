# Single source of truth for the project version and every pinned dependency/plugin
# version. build.gradle.kts and settings.gradle.kts read these — do not hardcode
# versions in the build scripts.

# Project version. Surfaced at runtime via the generated org.plukh.mkvtool.BuildInfo, and it
# names every release archive - a `v*` tag is refused unless it reads exactly `v<version>`,
# and refused outright while this is a snapshot. Goes back to a snapshot after a release.
version=2.0.1-SNAPSHOT

# Toolchain / dependency / plugin pins.
kotlinVersion=2.4.10
picocliVersion=4.7.7
kotestVersion=6.2.3
# YAML parsing (config.yaml, episodes.yaml). 2.x is the maintained line; v1 ran 1.30.
snakeyamlVersion=2.4
# JSON parsing (mkvmerge -J, the TheMovieDB API) and, in phase 2, JSON output. The
# serialization *plugin* ships with the Kotlin distribution, so it takes kotlinVersion
# and only the runtime library is pinned here.
kotlinxSerializationVersion=1.11.0
shadowVersion=9.6.1
# GraalVM native-build-tools: provides the nativeCompile task. Needed to build the
# distributed native binaries; ordinary build/test/installDist do not use it.
graalvmNativeVersion=1.1.6

# Build performance.
org.gradle.parallel=true
org.gradle.caching=true
